name: Intraday Trading Pipeline

on:
  # Corre cada 30 min durante ventana que cubre apertura NYSE en verano (EDT) e invierno (EST)
  # EDT: mercado 13:30-20:00 UTC | EST: 14:30-21:00 UTC → ventana segura 13:00-21:30 UTC
  schedule:
    - cron: "0,30 13-20 * * 1-5"   # :00 y :30 de 13:00 a 20:30 UTC
    - cron: "0,30 21 * * 1-5"      # 21:00 y 21:30 UTC (cierre en horario EST)
  workflow_dispatch:
    inputs:
      force_run:
        description: "Forzar ejecucion aunque el mercado este cerrado"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: intraday-pipeline
  cancel-in-progress: false   # nunca cancelar una ejecucion activa

jobs:
  run-pipeline:
    name: Intraday pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      ALPACA_DATA_URL: "https://data.alpaca.markets"
      ALPACA_FEED: "iex"
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PRICE_CHUNK_SIZE: "100"
      MAX_OPEN_POSITIONS: "20"
      MIN_ORDER_NOTIONAL: "1.0"
      SEED: "42"

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para push a data-logs

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt --quiet

      - name: Cache modelo FinBERT
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ hashFiles('requirements.txt') }}
          restore-keys: finbert-

      - name: Cache precios e indicadores
        uses: actions/cache@v4
        with:
          path: |
            data/raw/prices_raw.parquet
            data/processed/indicators.parquet
          key: indicators-${{ github.run_id }}
          restore-keys: indicators-

      - name: Verificar si el mercado esta abierto
        id: market_check
        run: |
          python scripts/check_market_open.py && echo "market_open=true" >> $GITHUB_OUTPUT || echo "market_open=false" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Salir si mercado cerrado (y no es ejecucion forzada)
        if: steps.market_check.outputs.market_open == 'false' && github.event.inputs.force_run != 'true'
        run: |
          echo "Mercado cerrado. Pipeline omitido."
          exit 0

      - name: Ejecutar pipeline intraday
        if: steps.market_check.outputs.market_open == 'true' || github.event.inputs.force_run == 'true'
        run: python scripts/run_intraday_pipeline.py

      - name: Commit logs a rama data-logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday_logs/ data/processed/sentiment_scores.csv models/ -f 2>/dev/null || true
          git diff --staged --quiet && echo "Sin cambios para commitear" || \
            git commit -m "auto(intraday): $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push origin HEAD:data-logs 2>/dev/null || \
            (git fetch origin data-logs && git push origin HEAD:data-logs --force-with-lease)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
