name: EOD Report

# Reporte End-of-Day tras el cierre del mercado (16:00 ET).
# 21:30 UTC cubre el cierre tanto en EST (16:30 ET) como con margen en EDT (17:30 ET).
#
# Solo consulta el estado de la cuenta de Alpaca (sin dependencia de StockTwits),
# así que funciona desde los runners de GitHub. Con trading en dry-run la cuenta
# estará plana, pero el reporte igual es válido (equity, P&L, posiciones).
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eod-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
      ALPACA_FEED: ${{ secrets.ALPACA_FEED }}
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (estricto)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar reporte EOD
        run: python scripts/eod_report.py

      - name: Commit reporte
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin reporte nuevo que commitear."
          else
            git commit -m "chore(eod): reporte $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
