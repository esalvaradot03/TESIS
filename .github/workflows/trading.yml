name: Live Paper Trading

# El cron de GitHub Actions corre en UTC y NO ajusta por horario de verano (DST).
# El horario de mercado 9:30–16:00 ET equivale a:
#   - EST (invierno, UTC-5): 14:30–21:00 UTC
#   - EDT (verano,  UTC-4): 13:30–20:00 UTC
# Cada 30 min cubriendo AMBAS franjas (13:00–21:30 UTC, lun–vie); el chequeo
# get_clock().is_open de Alpaca (que ya contempla feriados) hace no-op fuera de horario.
#
# SEGURIDAD: corre en DRY-RUN por defecto (también en schedule, por la lógica
# `dry_run != 'false'` del step) → NO envía órdenes a Alpaca. NO se opera con
# model_v0 (sabemos que es malo); solo se acumulan run logs.
#
# LIMITACIÓN CONOCIDA: el endpoint público de StockTwits está tras Cloudflare,
# que bloquea (403) las IPs de datacenter de GitHub. Por eso desde Actions el
# scraper no obtiene datos en horario de mercado; live_runner lo maneja con
# gracia (loguea y termina limpio, sin crashear). Para recolectar datos reales
# hay que correr el live_runner desde una IP residencial (ver docs).
on:
  schedule:
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No enviar órdenes a Alpaca (solo predecir + run log)"
        type: boolean
        default: true
      force:
        description: "Operar aunque el mercado esté cerrado (pruebas)"
        type: boolean
        default: false
      max_symbols:
        description: "Máx. trending symbols a operar"
        type: string
        default: "15"

# Evita corridas solapadas (cada tick debe terminar antes del siguiente)
concurrency:
  group: live-trading
  cancel-in-progress: false

permissions:
  contents: write   # necesario para commitear los run logs de vuelta al repo

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Credenciales desde SECRETS (nunca desde .env en el repo)
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
      ALPACA_FEED: ${{ secrets.ALPACA_FEED }}
      # StockTwits usa el endpoint público read-only: NO requiere key.
      PYTHONIOENCODING: "utf-8"
      TRANSFORMERS_OFFLINE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (estricto)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache modelo FinBERT (HuggingFace ~438MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Clave estable: el modelo no cambia entre runs → se reutiliza la caché
          key: hf-finbert-prosusai-v1
          restore-keys: |
            hf-finbert-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar flujo de trading en vivo (DRY-RUN por defecto)
        run: |
          python -m src.trading.live_runner \
            --model-dir models/model_v0 \
            --max-symbols "${{ github.event.inputs.max_symbols || '15' }}" \
            ${{ github.event.inputs.dry_run != 'false' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit run logs (datos de reentrenamiento)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/run_*.parquet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin run logs nuevos que commitear."
          else
            git commit -m "chore(live): run log $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            # Reintento ante carrera con otros commits del bot
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
